<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Scanner Absen</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root{--green:#0f5f38;--light:#eef8ef;--warn:#fff4e5;--err:#fdecea;--line:#c9dfce}
  *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f4faf5;color:#123b25;padding:18px}
  .wrap{max-width:560px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(15,95,56,.08)}
  h2{margin:0 0 12px;color:var(--green)} label{font-weight:700;font-size:14px}
  select,button{width:100%;padding:12px;font-size:16px;border-radius:12px} select{border:1px solid var(--line);background:#fff;margin-top:6px}
  .mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.mode button{border:1px solid var(--line);background:#eaf5ec;color:var(--green);font-weight:700}.mode button.active{background:var(--green);color:#fff}
  #reader{width:100%;max-width:420px;margin:16px auto 0}.status{margin-top:12px;padding:12px;border-radius:12px;display:none;font-size:14px;font-weight:700}.ok{display:block;background:#e7f6ea;color:#146c2e;border:1px solid #b7e1c0}.warn{display:block;background:#fff4e5;color:#8a5700;border:1px solid #f2d19c}.err{display:block;background:#fdecea;color:#b3261e;border:1px solid #f5c2c0}.small{font-size:13px;color:#4d6b57;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <h2>Scan QR untuk Absen</h2>
  <label for="guru">Pilih Guru:</label>
  <select id="guru"><option value="">Memuat daftar guru...</option></select>
  <div class="small">Pilih mode sebelum scan. Datang dan pulang akan tersimpan dalam <b>1 baris</b> untuk nama, tanggal, dan sesi yang sama.</div>
  <div class="mode">
    <button id="btnDatang" class="active" type="button" onclick="setMode('datang')">Absen Datang</button>
    <button id="btnPulang" type="button" onclick="setMode('pulang')">Absen Pulang</button>
  </div>
  <div id="status" class="status"></div>
  <div class="small" id="info">Arahkan kamera ke QR siswa.</div>
  <div id="reader"></div>
</div>
<script>
  // GANTI URL INI dengan URL Web App Apps Script terbaru setelah deploy ulang.
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzL8_OIBPRtCZGY7fO2_TO1T4Fsp-DHtFrv5eyOM5cKCih9mbWn2F7-VIV-DsGbMg2BUg/exec";

  let lastKey = "";
  let modeAbsen = "datang";
  let scannerStarted = false;

  function byId(id){ return document.getElementById(id); }
  function showStatus(message, type){
    const el = byId('status');
    el.className = 'status ' + (type || 'warn');
    el.textContent = message;
    el.style.display = 'block';
  }
  function setMode(mode){
    modeAbsen = mode;
    byId('btnDatang').classList.toggle('active', mode === 'datang');
    byId('btnPulang').classList.toggle('active', mode === 'pulang');
    showStatus('Mode aktif: ' + (mode === 'datang' ? 'Absen Datang' : 'Absen Pulang'), mode === 'datang' ? 'ok' : 'warn');
  }

  function jsonp(action, params){
    return new Promise(function(resolve, reject){
      const callbackName = 'cb_' + action + '_' + Date.now() + '_' + Math.floor(Math.random()*10000);
      const script = document.createElement('script');
      const query = new URLSearchParams(params || {});
      query.set('action', action);
      query.set('callback', callbackName);
      window[callbackName] = function(response){
        cleanup();
        resolve(response);
      };
      function cleanup(){
        try{ delete window[callbackName]; }catch(e){}
        if(script.parentNode) script.parentNode.removeChild(script);
      }
      script.onerror = function(){ cleanup(); reject(new Error('Tidak bisa menghubungi Apps Script.')); };
      script.src = SCRIPT_URL + '?' + query.toString();
      document.body.appendChild(script);
    });
  }

  function resetGuruOptions(){
    byId('guru').innerHTML = '<option value="">-- Pilih Guru --</option>';
  }
  function loadTeachers(){
    resetGuruOptions();
    jsonp('getAppData', {}).then(function(response){
      if(!response || !response.ok || !response.data){
        showStatus('Gagal memuat data guru dari Apps Script.', 'err'); return;
      }
      const teachers = response.data.teachers || [];
      if(!teachers.length){
        byId('guru').innerHTML = '<option value="">Belum ada guru aktif di sheet</option>';
        showStatus('Daftar guru kosong. Cek sheet GURU dan kolom Aktif = YA.', 'warn'); return;
      }
      resetGuruOptions();
      teachers.forEach(function(name){
        const opt = document.createElement('option'); opt.value = String(name).trim(); opt.textContent = String(name).trim(); byId('guru').appendChild(opt);
      });
      showStatus('Daftar guru berhasil dimuat. Pilih guru, lalu scan QR.', 'ok');
    }).catch(function(err){ showStatus(err.message, 'err'); });
  }

  function sendAttendance(decodedText, guru){
    return jsonp('saveAttendance', {
      qrText: decodedText,
      guru: guru,
      mode: modeAbsen,
      source: 'GitHub Live Scanner',
      fromHosted: '1',
      userAgent: navigator.userAgent
    });
  }

  function onScanSuccess(decodedText){
    const guru = byId('guru').value;
    if(!guru){ showStatus('Silakan pilih guru terlebih dahulu.', 'warn'); return; }
    const key = modeAbsen + '|' + decodedText;
    if(key === lastKey) return;
    lastKey = key;
    showStatus('QR terbaca. Mengirim absen ' + modeAbsen + '...', 'ok');
    sendAttendance(decodedText, guru).then(function(res){
      if(res && res.ok){
        const nama = res.student && res.student.nama ? res.student.nama : 'Siswa';
        showStatus(nama + ' - ' + (res.mode || modeAbsen) + ' berhasil: ' + (res.jam || ''), 'ok');
        if(navigator.vibrate) navigator.vibrate([100,40,100]);
      }else{
        showStatus((res && res.message) ? res.message : 'Absensi gagal disimpan.', (res && res.duplicate) ? 'warn' : 'err');
      }
      setTimeout(function(){ lastKey = ''; }, 3000);
    }).catch(function(err){
      showStatus('Gagal mengirim absensi: ' + err.message, 'err');
      setTimeout(function(){ lastKey = ''; }, 3000);
    });
  }
  function startScanner(){
    if(scannerStarted) return; scannerStarted = true;
    const scanner = new Html5QrcodeScanner('reader', {fps:10, qrbox:250}, false);
    scanner.render(onScanSuccess);
  }
  document.addEventListener('DOMContentLoaded', function(){ loadTeachers(); startScanner(); });
</script>
</body>
</html>
